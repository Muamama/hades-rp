<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
<defs>
  <filter id="jagged" x="-15%" y="-20%" width="130%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018 0.12" numOctaves="2" seed="17" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="16" xChannelSelector="R" yChannelSelector="B"/>
  </filter>
  <filter id="redGlow" x="-20%" y="-30%" width="140%" height="160%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feFlood flood-color="#d00000" flood-opacity="0.8"/>
    <feComposite in2="blur" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="slice1"><rect x="120" y="640" width="960" height="70"/></clipPath>
  <clipPath id="slice2"><rect x="120" y="710" width="960" height="65"/></clipPath>
  <clipPath id="slice3"><rect x="120" y="775" width="960" height="85"/></clipPath>
  <clipPath id="slice4"><rect x="120" y="860" width="960" height="75"/></clipPath>
  <clipPath id="slice5"><rect x="120" y="935" width="960" height="90"/></clipPath>
  <g id="words" fill="#f01818" stroke="#680000" stroke-width="4" paint-order="stroke fill" font-family="Noto Serif TC,Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="96" font-weight="900" text-anchor="middle" letter-spacing="10">
    <text x="600" y="755">特別驚喜...</text>
    <text x="600" y="920">新入獄犬</text>
  </g>
</defs>
<rect width="1200" height="1600" fill="#000000"/>
<g filter="url(#redGlow)" opacity="0.45"><use href="#words"/></g>
<g filter="url(#jagged)">
  <use href="#words" clip-path="url(#slice1)" transform="translate(-12 0) skewX(-2)"/>
  <use href="#words" clip-path="url(#slice2)" transform="translate(16 -2)"/>
  <use href="#words" clip-path="url(#slice3)" transform="translate(-8 4) skewX(3)"/>
  <use href="#words" clip-path="url(#slice4)" transform="translate(13 -3)"/>
  <use href="#words" clip-path="url(#slice5)" transform="translate(-15 2) skewX(-2)"/>
</g>
<g fill="#f01818" opacity="0.9">
  <path d="M286 690l42 16-31 34z"/><path d="M930 748l-48 13 35 31z"/>
  <path d="M350 887l-35 28 47 8z"/><path d="M850 948l51-25-24 46z"/>
  <path d="M520 1000l30-15-9 42z"/><path d="M700 655l21-35 12 44z"/>
</g>
<g fill="none" stroke="#000000" stroke-width="11" stroke-linecap="square">
  <path d="M415 665l58 73-39 48 67 72-31 83"/>
  <path d="M777 674l-45 62 38 41-54 66 36 94"/>
  <path d="M594 660l28 65-35 54 41 58-25 100"/>
</g>
</svg>
