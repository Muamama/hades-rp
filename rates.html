  <style>
    /* ================================
       Gil 金幣樣式
    ================================ */

    .gil-price {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      white-space: nowrap;
    }

    .gil-icon {
      width: 18px;
      height: 18px;
      object-fit: contain;
      flex-shrink: 0;
      filter: drop-shadow(0 0 4px rgba(212,175,55,0.45));
      animation: gilFloat 2.3s ease-in-out infinite;
    }

    .rates-item:hover .gil-icon,
    .reward-btn:hover .gil-icon {
      filter: drop-shadow(0 0 8px rgba(212,175,55,0.8));
    }

    @keyframes gilFloat {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-2px);
      }
    }

    /* ================================
       rates 對齊修正
    ================================ */

    .rates-table {
      width: min(740px, 92%);
      margin: 0 auto;
    }

    .rates-head,
    .rates-item {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      column-gap: 24px;
    }

    .rates-head {
      padding: 0 0 12px;
    }

    .rates-item {
      padding: 14px 0;
    }

    .rates-head span:last-child,
    .rates-item span:last-child {
      justify-self: end;
      text-align: right;
    }

    .reward-btn {
      width: 100%;
      background: transparent;
      border: 0;
      color: inherit;
      font: inherit;
      cursor: pointer;
      text-align: left;
      padding: 14px 0;
    }

    .reward-btn:hover {
      color: #f3d36a;
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.45);
    }

    /* ================================
       每個 section 右下角詳情解釋
    ================================ */

    .rates-block {
      position: relative;
      padding-bottom: 58px;
    }

    .section-detail-btn {
      position: absolute;
      right: 28px;
      bottom: 22px;
      z-index: 3;

      border: 0;
      background: transparent;
      color: rgba(212, 175, 55, 0.72);
      font-family: inherit;
      font-size: 0.88rem;
      letter-spacing: 0.12em;
      cursor: pointer;

      padding: 4px 2px;
      transition: 0.3s ease;
    }

    .section-detail-btn::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -3px;
      width: 100%;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(212, 175, 55, 0.8),
        transparent
      );
      transform: scaleX(0);
      transform-origin: center;
      transition: 0.3s ease;
    }

    .section-detail-btn:hover {
      color: #f3d36a;
      text-shadow:
        0 0 8px rgba(212, 175, 55, 0.55),
        0 0 16px rgba(130, 0, 0, 0.45);
    }

    .section-detail-btn:hover::after {
      transform: scaleX(1);
    }

    /* ================================
       供奉 popup 裡的金幣
    ================================ */

    .reward-popup-amount {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 10px 0 6px;
      color: #f3d36a;
      font-size: 1.2rem;
      letter-spacing: 0.08em;
    }

    .reward-popup-amount img {
      width: 20px;
      height: 20px;
      filter: drop-shadow(0 0 6px rgba(212,175,55,0.6));
      animation: gilFloat 2.3s ease-in-out infinite;
    }

    /* ================================
       共用 popup 防止背景滾動
    ================================ */

    body.popup-open {
      overflow: hidden;
    }

    /* ================================
       section 說明 popup
    ================================ */

    .section-popup-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 24px;
      background:
        radial-gradient(circle at center, rgba(120, 0, 0, 0.28), transparent 42%),
        rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(8px);
    }

    .section-popup-overlay.show {
      display: flex;
    }

    .section-popup-card {
      position: relative;
      width: min(540px, 92vw);
      padding: 42px 38px 36px;

      border: 1px solid rgba(212, 175, 55, 0.38);
      border-radius: 22px;

      background:
        radial-gradient(circle at top, rgba(120, 0, 0, 0.28), transparent 48%),
        linear-gradient(180deg, rgba(20, 6, 8, 0.98), rgba(4, 2, 3, 0.96));

      box-shadow:
        0 0 36px rgba(120, 0, 0, 0.42),
        inset 0 0 24px rgba(212, 175, 55, 0.06);

      animation: sectionPopupIn 0.32s ease both;
    }

    .section-popup-card::before {
      content: "";
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(212, 175, 55, 0.14);
      border-radius: 16px;
      pointer-events: none;
    }

    .section-popup-close {
      position: absolute;
      top: 16px;
      right: 18px;
      z-index: 2;

      border: 0;
      background: transparent;
      color: rgba(212, 175, 55, 0.75);
      font-size: 1.05rem;
      cursor: pointer;
      transition: 0.25s ease;
    }

    .section-popup-close:hover {
      color: #f3d36a;
      transform: rotate(90deg);
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.65);
    }

    .section-popup-info {
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .section-popup-overline {
      margin: 0 0 14px;
      color: rgba(212, 175, 55, 0.62);
      font-size: 0.72rem;

    .section-popup-info h3 {

      letter-spacing: 0.16em;
      text-shadow:

    .section-popup-info p {

      color: rgba(255, 239, 205, 0.86);
      font-size: 1rem;
      line-height: 2;
      letter-spacing: 0.08em;
      text-align: left;
    }

    @keyframes sectionPopupIn {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ================================
       reward note 修正
    ================================ */

    /* ================================

        font-size: 1.55rem;
      }

      .section-popup-info p {
        font-size: 0.92rem;
        line-height: 1.9;
      }
    }

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const siteHeader = document.querySelector('.site-header');
      const menuToggle = document.getElementById('menuToggle');
      const mobileMenu = document.getElementById('mobileMenu');

      /* ================================
         Header scroll
      ================================ */

      if (siteHeader) {
        window.addEventListener('scroll', function () {
          if (window.scrollY > 10) {
            siteHeader.classList.add('scrolled');
          } else {
            siteHeader.classList.remove('scrolled');
          }
        });
      }

      /* ================================
         Mobile menu
      ================================ */

      if (menuToggle && mobileMenu) {
        menuToggle.addEventListener('click', function (e) {
          e.stopPropagation();

          menuToggle.classList.toggle('active');
          mobileMenu.classList.toggle('open');

          const isOpen = mobileMenu.classList.contains('open');
          menuToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        });

        mobileMenu.addEventListener('click', function (e) {
          e.stopPropagation();
        });

        document.addEventListener('click', function () {
          menuToggle.classList.remove('active');
          mobileMenu.classList.remove('open');
          menuToggle.setAttribute('aria-expanded', 'false');
        });
      }

      /* ================================
         冥界供奉階級 Popup
      ================================ */

      const rewardButtons = document.querySelectorAll('.reward-btn');
      const rewardPopupOverlay = document.getElementById('rewardPopupOverlay');
      const rewardPopupClose = document.getElementById('rewardPopupClose');

      const rewardPopupName = document.getElementById('rewardPopupName');
      const rewardPopupAmount = document.getElementById('rewardPopupAmount');
      const rewardPopupText = document.getElementById('rewardPopupText');

      function gilHTML(amount) {
        const safeAmount = Number(amount || 0).toLocaleString();

        return `
          <span class="reward-popup-amount">
            ${safeAmount}
            <img src="images/Gil_Icon.png" alt="Gil">
          </span>
        `;
      }

      function openRewardPopup(tier, amount, desc) {
        if (!rewardPopupOverlay || !rewardPopupName || !rewardPopupAmount || !rewardPopupText) return;

        rewardPopupName.textContent = tier || '冥界供奉';
        rewardPopupAmount.innerHTML = gilHTML(amount);
        rewardPopupText.textContent = desc || '此供奉階級尚未補充說明。';

        rewardPopupOverlay.classList.add('show');
        document.body.classList.add('popup-open');
      }

      function closeRewardPopup() {
        if (!rewardPopupOverlay) return;

        rewardPopupOverlay.classList.remove('show');

        if (!sectionPopupOverlay || !sectionPopupOverlay.classList.contains('show')) {
          document.body.classList.remove('popup-open');
        }
      }

      rewardButtons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          openRewardPopup(
            btn.dataset.tier,
            btn.dataset.amount,
            btn.dataset.desc
          );
        });
      });

      if (rewardPopupClose) {
        rewardPopupClose.addEventListener('click', closeRewardPopup);
      }

      if (rewardPopupOverlay) {
        rewardPopupOverlay.addEventListener('click', function (e) {
          if (e.target === rewardPopupOverlay) {
            closeRewardPopup();
          }
        });
      }

      /* ================================
         Section 詳情 Popup
      ================================ */

      const sectionDetailButtons = document.querySelectorAll('.section-detail-btn');
      const sectionPopupOverlay = document.getElementById('sectionPopupOverlay');
      const sectionPopupClose = document.getElementById('sectionPopupClose');
      const sectionPopupTitle = document.getElementById('sectionPopupTitle');
      const sectionPopupDesc = document.getElementById('sectionPopupDesc');

      function openSectionPopup(title, desc) {
        if (!sectionPopupOverlay || !sectionPopupTitle || !sectionPopupDesc) return;

        sectionPopupTitle.textContent = title || '詳情解釋';
        sectionPopupDesc.textContent = desc || '此區塊目前尚未補充詳細說明。';

        sectionPopupOverlay.classList.add('show');
        document.body.classList.add('popup-open');
      }

      function closeSectionPopup() {
        if (!sectionPopupOverlay) return;

        sectionPopupOverlay.classList.remove('show');

        if (!rewardPopupOverlay || !rewardPopupOverlay.classList.contains('show')) {
          document.body.classList.remove('popup-open');
        }
      }

      sectionDetailButtons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          openSectionPopup(
            btn.dataset.title,
            btn.dataset.desc
          );
        });
      });

      if (sectionPopupClose) {
        sectionPopupClose.addEventListener('click', closeSectionPopup);
      }

      if (sectionPopupOverlay) {
        sectionPopupOverlay.addEventListener('click', function (e) {
          if (e.target === sectionPopupOverlay) {
            closeSectionPopup();
          }
        });
      }

      /* ================================
         ESC 關閉所有 Popup
      ================================ */

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          closeRewardPopup();
          closeSectionPopup();
        }
      });
    });
  </script>
